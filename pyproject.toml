[project]
name = "ssoo-cpp-exam-desktop"
version = "0.1.0"
description = "Genera el paquete para preparar los puestos del examen de C++ de Sistemas Operativos (ULL) sin conexión"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
construir = "construir:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["construir.py"]
